<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hotline Village: voice test</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Fredoka', system-ui, sans-serif; background: #fff6e0; color: #6b4a2f; margin: 0; padding: 1.2rem; }
  h1 { margin: 0 0 0.6rem; color: #3f7a3a; }
  .row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin: 0.5rem 0; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 0.45rem 1rem; cursor: pointer; background: #6fb05a; color: #fff; box-shadow: 0 3px 0 #3f7a3a; }
  button.ghost { background: #f6e7c1; color: #6b4a2f; box-shadow: 0 3px 0 #d8c290; }
  button.stop { background: #d9826b; box-shadow: 0 3px 0 #a85a45; }
  input, textarea { font: inherit; border-radius: 0.7rem; border: 2px solid #f6e7c1; padding: 0.4rem 0.6rem; background: #fff; color: #6b4a2f; }
  textarea { width: 100%; box-sizing: border-box; height: 4.5rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
  #log { background: #fff; border-radius: 0.8rem; padding: 0.6rem; height: 50vh; overflow: auto; font-family: ui-monospace, monospace; font-size: 0.8rem; white-space: pre-wrap; }
  .e-error { color: #c0392b; font-weight: 700; }
  .e-tool { color: #8e44ad; }
  .e-lookup { color: #1a7f8e; font-weight: 600; }
  .e-speech-npc { color: #2c7a3a; }
  .e-speech-player { color: #2b5ea8; }
  .e-status { color: #b9770e; }
  #vol { display: inline-block; width: 120px; height: 10px; background: #f6e7c1; border-radius: 999px; overflow: hidden; vertical-align: middle; }
  #vol > i { display: block; height: 100%; width: 0; background: #6fb05a; }
</style>
</head>
<body>
<h1>Hotline Village: voice test</h1>
<div class="row">
  <input id="key" type="password" placeholder="Vapi public key" size="40">
  <button class="ghost" id="saveKey">Save key</button>
  <span id="keyState"></span>
</div>
<div class="row" id="npcs"></div>
<div class="row">
  <button class="stop" id="stop">Stop</button>
  <input id="note" placeholder="inform(): e.g. Player now has 3/3 egg." size="40">
  <button class="ghost" id="inform">Inform</button>
  <label><input type="checkbox" id="silent"> silent</label>
  <span>volume <span id="vol"><i></i></span></span>
  <label><input type="checkbox" id="showPartial"> show partials</label>
</div>
<textarea id="ctx">{"inventory":{"egg":2,"flower":1},"quests":[],"bells":120,"items":["egg","milk","wheat","tomato","pumpkin","wood","flower","mushroom"],"playerName":"Paul"}</textarea>
<div class="row"><button class="ghost" id="showCfg">Log assistant config (selected NPC)</button><button class="ghost" id="clear">Clear log</button></div>
<div id="log"></div>
<script type="module">
import hotline from './hotline.js';
const $ = (id) => document.getElementById(id);
const log = $('log');
let lastNpc = 'maple';
function line(text, cls = '') {
  const d = document.createElement('div');
  d.textContent = `${new Date().toISOString().slice(11, 23)}  ${text}`;
  if (cls) d.className = cls;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function refreshKey() { $('keyState').textContent = hotline.hasKey() ? 'key saved' : 'no key yet'; }
refreshKey();
$('saveKey').onclick = () => { hotline.setKey($('key').value); $('key').value = ''; refreshKey(); hotline.warmMic(); };
for (const id of hotline.npcs) {
  const b = document.createElement('button');
  b.textContent = 'Talk to ' + id;
  b.onmouseenter = () => hotline.prewarm(id);
  b.onclick = () => { lastNpc = id; line(`> start(${id})`); hotline.start(id, $('ctx').value); };
  $('npcs').appendChild(b);
}
$('stop').onclick = () => { line('> stop()'); hotline.stop(); };
$('inform').onclick = () => { const ok = hotline.inform($('note').value, $('silent').checked); line(`> inform(${JSON.stringify($('note').value)}) -> ${ok}`); };
$('showCfg').onclick = () => { try { line(JSON.stringify(hotline._buildAssistant(lastNpc, JSON.parse($('ctx').value)), null, 2)); } catch (e) { line('config error: ' + e.message, 'e-error'); } };
$('clear').onclick = () => { log.textContent = ''; };
window.addEventListener('error', (e) => line('window error: ' + e.message, 'e-error'));
window.addEventListener('unhandledrejection', (e) => line('unhandled: ' + (e.reason?.message || e.reason), 'e-error'));
function tick() {
  const evs = JSON.parse(hotline.drain());
  for (const ev of evs) {
    if (ev.type === 'volume') { $('vol').firstChild.style.width = Math.round(ev.level * 100) + '%'; continue; }
    if (ev.type === 'speech' && !ev.final && !$('showPartial').checked) continue;
    let cls = 'e-' + ev.type;
    if (ev.type === 'speech') cls = 'e-speech-' + ev.who;
    if (ev.type === 'status' && ev.status === 'error') cls = 'e-error';
    line(JSON.stringify(ev), cls);
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
line('hotline loaded. Hover a button to prewarm, click to start.');
</script>
</body>
</html>
